networks:
  coolify:
    external: true
    name: coolify

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - billreader-data:/app/data
      - billreader-uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///data/dev.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - coolify

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      backend:
        condition: service_started
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
    restart: unless-stopped
    networks:
      - coolify

volumes:
  billreader-data:
  billreader-uploads:
