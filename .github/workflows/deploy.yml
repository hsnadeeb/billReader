name: Deploy billreader

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy billreader
        run: |
          cd /opt/billreader
          git pull origin main
          npm ci
          npm run build
          cd backend
          source venv/bin/activate
          pip install -r requirements.txt
          cd ..
          sudo systemctl restart billreader-backend billreader-frontend
          echo "billreader deployed"
