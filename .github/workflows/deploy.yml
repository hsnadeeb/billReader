name: Deploy billreader

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH with verbose
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -x
          echo "$SSH_KEY" > /tmp/key
          chmod 600 /tmp/key
          ssh -vvv -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i /tmp/key ubuntu@161.118.167.226 whoami 2>&1 || true
