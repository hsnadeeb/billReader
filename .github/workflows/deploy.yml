name: Deploy billreader

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Debug SSH setup
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -x
          eval $(ssh-agent -s)
          echo "$SSH_KEY" > /tmp/key
          chmod 600 /tmp/key
          ssh-keygen -y -f /tmp/key > /tmp/key.pub 2>&1 && echo "KEY VALID" || echo "KEY INVALID"
          cat /tmp/key.pub 2>/dev/null
