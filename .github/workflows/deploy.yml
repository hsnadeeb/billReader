name: Deploy billreader

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          echo "161.118.167.226 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEILgx7QBS+2f2GFgs7yjamKvcGxZDYngEcJD9oU/PDn" >> ~/.ssh/known_hosts

      - name: Deploy billreader
        run: |
          ssh -o ConnectTimeout=15 ubuntu@161.118.167.226 "
            cd /opt/billreader
            git pull origin main
            npm ci
            npm run build
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            cd ..
            sudo systemctl restart billreader-backend billreader-frontend
            echo 'billreader deployed'
          "
