name: Deploy billreader

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy billreader
        uses: appleboy/ssh-action@v2.2.0
        with:
          host: 161.118.167.226
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "SSH connection successful"
            whoami
            hostname
